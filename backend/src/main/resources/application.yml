server:
  address: 127.0.0.1
  port: ${PORT:8080}

spring:
  application:
    name: reservas-laboratorios
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/reservas.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
      data-source-properties:
        busy_timeout: 5000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
